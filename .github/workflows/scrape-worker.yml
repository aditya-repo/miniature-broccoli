name: Sarkari Result Scrape

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */12 * * *"

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      SCRAPE_OUTPUT_LOCAL: "true"
      SCRAPE_OUTPUT_REMOTE: "false"
      SCRAPE_PARALLEL_WORKERS: "2"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Scrape Sarkari Result
        run: npm run scrape:all

      - name: Verify scrape output
        run: |
          node --experimental-strip-types -e "
          import fs from 'node:fs';
          const data = JSON.parse(fs.readFileSync('output/latest-notifications.json', 'utf8'));
          console.log('Homepage sections:', data.sectionCount);
          console.log('Banner links:', data.bannerLinks?.length ?? 0);
          console.log('Section keys:', Object.keys(data.latestSections ?? {}).join(', '));
          if (!data.sectionCount) {
            throw new Error('Homepage scrape returned 0 sections.');
          }
          "

      - name: Check MongoDB secret
        run: |
          if [ -z "$MONGODB_URI" ]; then
            echo "::error::MONGODB_URI secret is missing. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Push output to MongoDB
        run: npm run push:db

      - name: Upload output artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-output
          path: output/
          if-no-files-found: ignore
